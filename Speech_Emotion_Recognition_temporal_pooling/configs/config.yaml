################################################################################
# configs/config.yaml
# Configuración global del proyecto SER — RAVDESS
# ÚNICA fuente de verdad. No repetir valores en notebooks.
################################################################################

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:
  data_raw:        "data/raw"
  data_processed:  "data/processed"
  audio_trimmed:   "data/processed/audio_trimmed"
  metadata:        "data/processed/metadata.parquet"
  splits:          "data/processed/splits.parquet"
  features_dir:    "data/processed/features"
  models_dir:      "models"
  reports_dir:     "reports"
  figures_dir:     "reports/figures"

# ---------------------------------------------------------------------------
# Reproducibilidad
# ---------------------------------------------------------------------------
seed: 42

# ---------------------------------------------------------------------------
# Mapping emocional RAVDESS → cuadrante Russell (1980)
# ---------------------------------------------------------------------------
emotion_mapping:
  code_to_name:
    1: "neutral"
    2: "calm"
    3: "happy"
    4: "sad"
    5: "angry"
    6: "fearful"
    7: "disgust"
    8: "surprised"

  name_to_quadrant:
    neutral:   "Q4"
    calm:      "Q4"
    happy:     "Q1"
    surprised: "Q1"
    angry:     "Q2"
    fearful:   "Q2"
    disgust:   "Q2"
    sad:       "Q3"

  quadrant_labels:
    Q1: "High Valence / High Arousal"
    Q2: "Low Valence / High Arousal"
    Q3: "Low Valence / Low Arousal"
    Q4: "High Valence / Low Arousal"

# ---------------------------------------------------------------------------
# Particiones
# ---------------------------------------------------------------------------
splits:
  # 3 actores masculinos (impares) y 3 femeninos (pares)
  test_independent_actors: [2, 4, 6, 19, 21, 23]

  test_dependent_strategy: "grouped_holdout"
  test_dependent_n_splits: 5
  test_dependent_fold_index: 3

  cv_folds: 5
  cv_strategy_dependent:   "StratifiedGroupKFold"
  cv_strategy_independent: "StratifiedGroupKFold"

  partition_values:
    development:              "development"
    test_speaker_dependent:   "test_speaker_dependent"
    test_speaker_independent: "test_speaker_independent"

# ---------------------------------------------------------------------------
# Trimming de audio
# ---------------------------------------------------------------------------
audio:
  sample_rate: 48000
  target_sample_rate: 16000
  frame_length_ms: 25
  hop_length_ms: 10
  threshold_db: -35
  padding_ms: 150
  trim_ratio_warning: 0.50

# ---------------------------------------------------------------------------
# Extractores de features
# ---------------------------------------------------------------------------
features:
  egemaps:
    config_name: "eGeMAPSv02"
    feature_level: "Functionals"
    n_features: 88

  wav2vec:
    model_name: "facebook/wav2vec2-base"
    revision: "966365c3dccea13c4bda090c093d08527a2200c4"
    layer: "last_hidden_state"
    pooling: "mean"
    embedding_dim: 768

# ---------------------------------------------------------------------------
# Modelos baseline — configuraciones fijas iniciales
# ---------------------------------------------------------------------------
models:
  random_forest:
    n_estimators: 300
    max_depth: null
    min_samples_leaf: 2
    class_weight: "balanced"

  logistic_regression:
    C: 1.0
    max_iter: 2000
    class_weight: "balanced"
    solver: "lbfgs"

  mlp:
    hidden_dims: [128, 64]
    activation: "relu"
    alpha: 0.0001
    learning_rate_init: 0.001
    max_iter: 300
    batch_size: 32
    early_stopping: true
    validation_fraction: 0.15
    n_iter_no_change: 20

# ---------------------------------------------------------------------------
# Métricas
# ---------------------------------------------------------------------------
metrics:
  primary: "macro_f1"
  secondary: ["balanced_accuracy", "uar", "accuracy", "weighted_f1"]

# ---------------------------------------------------------------------------
# Refinamientos
# ---------------------------------------------------------------------------
refinements:
  feature_importance:
    top_k: 15
    permutation_repeats: 10

  rfecv:
    inner_folds: 3
    step: 5
    min_features_to_select: 10
    n_jobs: 1

  pca:
    variance_thresholds: [0.90, 0.95]
    model: "logistic_regression"

# ---------------------------------------------------------------------------
# Diagnóstico e interpretación posterior al Sprint 3
# ---------------------------------------------------------------------------
post_sprint3:
  protocol: "speaker_independent"
  family_targets: ["emotion_original", "emotion_quadrant"]
  lda:
    shrinkage: "auto"
    protocols: ["speaker_independent", "speaker_dependent"]
    targets:
      - "emotion_original"
      - "emotion_quadrant"
      - "emotion_original_eval_quadrant"
